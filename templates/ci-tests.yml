name: Test del gioco

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Controlli statici (grafo, dati, sprite, flag, stinger, capitoli)
        run: node tests/validate.mjs
      - name: Partite simulate headless (5/5 finali)
        run: node tests/playthrough.mjs
